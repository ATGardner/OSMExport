name: CI

# Every push to every branch, main included — `main` and `main-<short-sha>` give
# you something deployable from the tip of main before a release is cut.
#
# Branches only. A bare `push` also matches tags, and release-please's `vX.Y.Z`
# tag would start a run whose metadata is nonsense: `type=ref,event=branch`
# emits nothing on a tag ref and `prefix={{branch}}-` renders empty, so the
# image job asks for the invalid tag `:-<sha>` and buildx rejects it. There is
# nothing to build there anyway — release.yml re-tags the image this workflow
# already produced for that commit rather than rebuilding it.
on:
  push:
    branches: ['**']

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  verify:
    name: Typecheck and lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm

      - run: npm ci

      - run: npm run typecheck

      - run: npm run lint:ci

  # Release-please's branch only bumps the version and rewrites the changelog,
  # and it is force-pushed on every merge to main — an image per force-push, and
  # nothing ever pulls it. `verify` still runs there so branch protection's
  # required checks can be satisfied on the release PR.
  image:
    name: Build and push image
    needs: verify
    if: ${{ !startsWith(github.ref_name, 'release-please--') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4.2.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Produces two tags, e.g. on branch `typescript` at commit a1b2c3d:
      #   ghcr.io/atgardner/osmexport:typescript
      #   ghcr.io/atgardner/osmexport:typescript-a1b2c3d
      # Slashes in branch names are slugified, so `renovate/foo` -> `renovate-foo`.
      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@80c7e94dd9b9319bd5eb7a0e0fe9291e23a2a2e9 # v6.1.0
        with:
          images: ghcr.io/atgardner/osmexport
          tags: |
            type=ref,event=branch
            type=sha,format=short,prefix={{branch}}-

      - name: Build and push
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  # Nothing used to look at the chart before publishing it — a template that
  # rendered garbage still got packaged and pushed, and you found out at
  # `helm install`. Runs alongside `verify` rather than after it: the chart
  # does not depend on the TypeScript building.
  chart-verify:
    name: Lint and test chart
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      # The publish jobs use whatever helm the runner image ships. This one
      # pins it: a suite whose result changes when that image rolls is not a
      # suite, and `helm plugin install` flags differ across helm majors.
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v4.2.3

      - run: helm lint charts/osmexport --strict

      - name: Render non-default values
        run: |
          set -euo pipefail

          # `helm lint` only ever renders values.yaml as written. Each of these
          # takes a different branch through the templates, so a `{{- with }}`
          # or an indentation slip that only shows up once a value is set fails
          # here instead of at install time.
          helm template ci charts/osmexport --set 'fullnameOverride=custom'
          helm template ci charts/osmexport --set 'nameOverride=renamed'
          helm template ci charts/osmexport --set 'imagePullSecrets[0].name=ghcr-pull-secret'
          helm template ci charts/osmexport --set 'image.tag=main-abc1234' --set 'containerPort=8080'
          helm template ci charts/osmexport --set 'resources.limits.cpu=100m' --set 'nodeSelector.disktype=ssd'
          helm template ci charts/osmexport --set 'podAnnotations.team=maps' --set 'podLabels.tier=web'

      # Renders assert nothing about *what* came out. These do: the appVersion
      # fallback, the fullname collapse, and the Service selector matching the
      # pod labels all render valid YAML when broken.
      - name: Unit test the chart
        run: |
          set -euo pipefail
          helm plugin install https://github.com/helm-unittest/helm-unittest \
            --version v1.1.2 --verify=false
          helm unittest charts/osmexport

  chart:
    name: Package and push chart
    needs: [image, chart-verify]
    if: ${{ !startsWith(github.ref_name, 'release-please--') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      CHARTS: oci://ghcr.io/atgardner/charts
      CHART_REF: ghcr.io/atgardner/charts/osmexport
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Log in to GitHub Container Registry
        run: |
          echo '${{ secrets.GITHUB_TOKEN }}' \
            | helm registry login ghcr.io -u '${{ github.actor }}' --password-stdin

      - name: Package and push
        run: |
          set -euo pipefail

          # Two slugs, deliberately. The image tag is whatever metadata-action
          # produced (it permits `.` and `_`); a chart version is SemVer, whose
          # pre-release identifiers allow only [0-9A-Za-z-]. They can differ, and
          # that is fine — the chart version is a label, while --app-version
          # carries the exact image tag the chart will deploy.
          image_slug=$(printf '%s' "$GITHUB_REF_NAME" | tr '[:upper:]' '[:lower:]' \
            | sed 's#[^a-z0-9._-]#-#g')
          chart_slug=$(printf '%s' "$GITHUB_REF_NAME" | tr '[:upper:]' '[:lower:]' \
            | sed 's#[^a-z0-9-]#-#g')
          short="${GITHUB_SHA:0:7}"

          # Branch charts are pre-releases of the release this branch is built
          # on, so they read as "2.0.1 plus this branch" rather than a bare
          # 0.0.0. release-please owns this file, so it is the source of truth.
          base=$(jq -r '."."' .release-please-manifest.json)
          echo "base: $base | image slug: $image_slug | chart slug: $chart_slug | sha: $short"

          # Per-commit chart: pins the matching per-commit image.
          helm package charts/osmexport \
            --version "$base-$chart_slug-$short" \
            --app-version "$image_slug-$short"
          helm push "osmexport-$base-$chart_slug-$short.tgz" "$CHARTS"

          # Moving branch chart: its appVersion is the moving `<branch>` image
          # tag, so it always resolves to the newest build of this branch.
          # Re-pushed every commit so template changes land in it too.
          helm package charts/osmexport \
            --version "$base-$chart_slug" \
            --app-version "$image_slug"
          helm push "osmexport-$base-$chart_slug.tgz" "$CHARTS"
