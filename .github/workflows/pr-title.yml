name: PR title

# release-please reads the commit subject that lands on main. With squash
# merges that subject comes from the PR title, so this is where conventional
# commits actually have to be enforced — a non-conventional title silently
# produces no release rather than a visible failure.
#
# Kept out of ci.yml deliberately: that workflow triggers on `push`, which has
# no PR context and does not fire when a title is edited. The `edited` type
# below is what re-runs this check after a title is corrected.
on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

permissions: {}

jobs:
  lint:
    name: Conventional commit title
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    steps:
      - uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50 # v6.1.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
