---
replicaCount: 1

image:
  repository: ghcr.io/atgardner/osmexport
  pullPolicy: IfNotPresent
  # Defaults to the chart's appVersion, which CI pins to the image tag that
  # matches this chart version. Override only to pin a different image.
  tag: ""

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

podAnnotations: {}
podLabels: {}

service:
  type: ClusterIP
  port: 3000

# The app serves on 3000 and reads PORT from the environment.
containerPort: 3000

resources: {}

# There is no health endpoint, so both probes check the listening socket.
livenessProbe:
  tcpSocket:
    port: http
  initialDelaySeconds: 10
  periodSeconds: 20
readinessProbe:
  tcpSocket:
    port: http
  initialDelaySeconds: 5
  periodSeconds: 10

nodeSelector: {}
tolerations: []
affinity: {}
