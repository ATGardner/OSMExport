---
# The image reference and the `{{- with }}` guards are the parts of this chart
# that fail silently: a broken fallback still renders valid YAML, and a value
# that lands in the wrong place still passes `helm lint`.
suite: deployment
templates:
  - deployment.yaml
release:
  name: test-release
tests:
  - it: defaults the image tag to the chart appVersion
    chart:
      appVersion: 2.1.1
    asserts:
      - equal:
          path: spec.template.spec.containers[0].image
          value: ghcr.io/atgardner/osmexport:2.1.1

  - it: prefers an explicit image tag over the appVersion
    chart:
      appVersion: 2.1.1
    set:
      image.tag: main-abc1234
    asserts:
      - equal:
          path: spec.template.spec.containers[0].image
          value: ghcr.io/atgardner/osmexport:main-abc1234

  - it: omits imagePullSecrets by default
    asserts:
      - notExists:
          path: spec.template.spec.imagePullSecrets

  - it: renders imagePullSecrets when set
    set:
      imagePullSecrets:
        - name: ghcr-pull-secret
    asserts:
      - equal:
          path: spec.template.spec.imagePullSecrets[0].name
          value: ghcr-pull-secret

  - it: drives both the PORT env var and the container port from containerPort
    set:
      containerPort: 8080
    asserts:
      - equal:
          path: spec.template.spec.containers[0].env[0]
          value:
            name: PORT
            value: "8080"
      - equal:
          path: spec.template.spec.containers[0].ports[0].containerPort
          value: 8080
      - equal:
          path: spec.template.spec.containers[0].ports[0].name
          value: http

  # METRICS_ENABLED is what actually stops the listener — the app serves
  # metrics when it is unset, so an unset variable here would leave a disabled
  # release still listening on a port the chart never declared or exposed.
  # That is why it is rendered either way rather than only when metrics are on.
  - it: declares no metrics port by default and tells the app to stay quiet
    asserts:
      - lengthEqual:
          path: spec.template.spec.containers[0].ports
          count: 1
      - equal:
          path: spec.template.spec.containers[0].env[1]
          value:
            name: METRICS_ENABLED
            value: "false"

  - it: drives the metrics port and env vars from metrics.port when enabled
    set:
      metrics.enabled: true
      metrics.port: 9099
    asserts:
      - equal:
          path: spec.template.spec.containers[0].env[1]
          value:
            name: METRICS_ENABLED
            value: "true"
      - equal:
          path: spec.template.spec.containers[0].env[2]
          value:
            name: METRICS_PORT
            value: "9099"
      - equal:
          path: spec.template.spec.containers[0].ports[1]
          value:
            name: metrics
            containerPort: 9099
            protocol: TCP

  # The port in the annotation has to track metrics.port. Hardcoding it in
  # values.yaml renders a scrape target that is valid YAML, gets discovered,
  # and times out against a closed port.
  - it: annotates the pod for annotation-based scraping, using metrics.port
    set:
      metrics.enabled: true
      metrics.scrapeAnnotations: true
      metrics.port: 9099
    asserts:
      - equal:
          path: spec.template.metadata.annotations
          value:
            prometheus.io/scrape: "true"
            prometheus.io/path: /metrics
            prometheus.io/port: "9099"

  - it: merges the scrape annotations with the user's podAnnotations
    set:
      metrics.enabled: true
      metrics.scrapeAnnotations: true
      podAnnotations:
        team: maps
    asserts:
      - equal:
          path: spec.template.metadata.annotations["team"]
          value: maps
      - equal:
          path: spec.template.metadata.annotations["prometheus.io/scrape"]
          value: "true"

  - it: adds no scrape annotations by default
    asserts:
      - notExists:
          path: spec.template.metadata.annotations

  # The two flags are opt-in independently, so asking to be scraped without
  # exposing the port must not annotate a target nothing can reach.
  - it: omits the scrape annotations unless the metrics port is exposed too
    set:
      metrics.scrapeAnnotations: true
    asserts:
      - notExists:
          path: spec.template.metadata.annotations

  - it: omits empty optional blocks rather than emitting nulls
    asserts:
      - notExists:
          path: spec.template.spec.containers[0].resources
      - notExists:
          path: spec.template.spec.nodeSelector
      - notExists:
          path: spec.template.spec.affinity
      - notExists:
          path: spec.template.spec.tolerations
      - notExists:
          path: spec.template.metadata.annotations

  # Every one of these is a `{{- with }}` block whose body is indented by hand.
  # Getting the nindent wrong does not break the YAML, it silently moves the
  # value to a different node — `nodeSelector` at nindent 4 renders a null
  # nodeSelector and drops the map a level up, and helm exits 0. So assert the
  # path, not just that something rendered.
  - it: places optional blocks on the right node when set
    set:
      replicaCount: 3
      nodeSelector:
        disktype: ssd
      tolerations:
        - key: spot
          operator: Exists
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms: []
      resources:
        limits:
          cpu: 100m
      podAnnotations:
        team: maps
    asserts:
      - equal:
          path: spec.replicas
          value: 3
      - equal:
          path: spec.template.spec.nodeSelector
          value:
            disktype: ssd
      - equal:
          path: spec.template.spec.tolerations[0].key
          value: spot
      - exists:
          path: spec.template.spec.affinity.nodeAffinity
      - equal:
          path: spec.template.spec.containers[0].resources.limits.cpu
          value: 100m
      - equal:
          path: spec.template.metadata.annotations
          value:
            team: maps

  # podLabels must merge into the selector labels, not replace them. Replacing
  # them gives the Deployment a selector that does not match the pods it
  # creates, which installs cleanly and then never becomes ready.
  - it: merges podLabels into the selector labels rather than replacing them
    set:
      podLabels:
        tier: web
    asserts:
      - equal:
          path: spec.template.metadata.labels
          value:
            app.kubernetes.io/name: osmexport
            app.kubernetes.io/instance: test-release
            tier: web
      - equal:
          path: spec.selector.matchLabels
          value:
            app.kubernetes.io/name: osmexport
            app.kubernetes.io/instance: test-release

  # Mounting the volume somewhere other than where winston writes is the
  # failure this chart cannot detect at install time: the PVC binds, the pod
  # runs, and the logs still go to the container filesystem.
  - it: mounts no volume by default
    asserts:
      - notExists:
          path: spec.template.spec.volumes
      - notExists:
          path: spec.template.spec.containers[0].volumeMounts

  - it: mounts the claim it provisions at the app's log directory
    set:
      persistence.enabled: true
    asserts:
      - equal:
          path: spec.template.spec.containers[0].volumeMounts[0]
          value:
            name: logs
            mountPath: /app/logs
      - equal:
          path: spec.template.spec.volumes[0]
          value:
            name: logs
            persistentVolumeClaim:
              claimName: test-release-osmexport

  - it: mounts an existing claim by name
    set:
      persistence.enabled: true
      persistence.existingClaim: my-logs
    asserts:
      - equal:
          path: spec.template.spec.volumes[0].persistentVolumeClaim.claimName
          value: my-logs

  # fsGroup is what makes the root-owned volume writable by the unprivileged
  # user in the image. It belongs on the pod, not the container — Kubernetes
  # accepts a container-level securityContext without it and silently ignores
  # the ownership change.
  - it: sets fsGroup on the pod to match the image's GID
    asserts:
      - equal:
          path: spec.template.spec.securityContext.fsGroup
          value: 10001
      - notExists:
          path: spec.template.spec.containers[0].securityContext

  # Nulled rather than set to {} — helm merges maps, so an empty map leaves the
  # default fsGroup in place and would assert nothing.
  - it: omits the pod securityContext when emptied
    set:
      podSecurityContext: null
    asserts:
      - notExists:
          path: spec.template.spec.securityContext

  - it: probes the named port so it tracks containerPort
    asserts:
      - equal:
          path: spec.template.spec.containers[0].livenessProbe.tcpSocket.port
          value: http
      - equal:
          path: spec.template.spec.containers[0].readinessProbe.tcpSocket.port
          value: http
