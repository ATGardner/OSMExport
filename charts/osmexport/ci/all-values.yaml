---
# Every optional block set at once, for the kubeconform pass in CI. values.yaml
# leaves most of these empty, so the default render never exercises the
# `{{- with }}` branches at all and their field placement goes unchecked.
#
# The values are arbitrary. What matters is that each one is schema-valid, so
# anything kubeconform rejects is the chart's fault and not this file's.
replicaCount: 2

image:
  tag: main-abc1234
  pullPolicy: Always

imagePullSecrets:
  - name: ghcr-pull-secret

nameOverride: renamed

podAnnotations:
  team: maps

podLabels:
  tier: web

service:
  type: NodePort
  port: 8080

containerPort: 8080

logLevel: debug

# The ServiceMonitor is the chart's second CRD-backed object, so this is what
# makes kubeconform check it against the monitoring.coreos.com schema.
metrics:
  enabled: true
  port: 9099
  scrapeAnnotations: true
  serviceMonitor:
    enabled: true
    interval: 30s
    scrapeTimeout: 10s
    labels:
      release: kube-prometheus-stack
  dashboard:
    enabled: true
    label: grafana_dashboard
    labelValue: "1"
    folder: Maps

# Both at once. They are independent in the templates, and enabling both is the
# only way one render reaches every object the chart can produce. The HTTPRoute
# is the reason kubeconform needs a CRD schema source in ci.yml.
httpRoute:
  enabled: true
  annotations:
    external-dns.alpha.kubernetes.io/hostname: osmexport.example.com
  parentRefs:
    - name: my-gateway
      namespace: gateway-system
      sectionName: https
  hostnames:
    - osmexport.example.com

ingress:
  enabled: true
  className: nginx
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt
  hosts:
    - host: osmexport.example.com
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: osmexport-tls
      hosts:
        - osmexport.example.com

# ReadWriteMany because replicaCount is 2 above, which the chart refuses to
# render against a ReadWriteOnce claim.
persistence:
  enabled: true
  storageClass: fast
  accessModes:
    - ReadWriteMany
  size: 5Gi
  annotations:
    helm.sh/resource-policy: keep

podSecurityContext:
  fsGroup: 10001
  runAsNonRoot: true

resources:
  limits:
    cpu: 100m
    memory: 128Mi
  requests:
    cpu: 50m
    memory: 64Mi

nodeSelector:
  kubernetes.io/os: linux

tolerations:
  - key: spot
    operator: Exists
    effect: NoSchedule

affinity:
  nodeAffinity:
    preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 1
        preference:
          matchExpressions:
            - key: topology.kubernetes.io/zone
              operator: In
              values: [a]
